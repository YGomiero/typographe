name: Joomla update feed
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  publish-feed:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Download the installable package and publish its update feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected stable numeric tag'; exit 1; }
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "plg_system_typographe-$RELEASE_TAG.zip" --dir dist
          python3 tools/update-feed.py "dist/plg_system_typographe-$RELEASE_TAG.zip" "$RELEASE_TAG" dist/update.xml
          gh release upload "$RELEASE_TAG" dist/update.xml --clobber
